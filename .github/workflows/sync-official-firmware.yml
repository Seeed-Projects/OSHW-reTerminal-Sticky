name: Sync Official Firmware

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit in reterminal-sticky-playground-registry"
        required: false
        default: "main"
        type: string
  repository_dispatch:
    types:
      - sync-official-firmware
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-official-firmware.yml"
      - "scripts/sync_official_firmware.py"

permissions:
  contents: write

concurrency:
  group: sync-official-firmware
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror official firmware releases and update catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize GitHub Releases and firmware catalog
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
        run: |
          python3 scripts/sync_official_firmware.py \
            --source-ref "$SOURCE_REF" \
            --target-repo "$GITHUB_REPOSITORY" \
            --publish-releases

      - name: Commit updated firmware catalog
        run: |
          if [ -z "$(git status --porcelain firmware/)" ]; then
            echo "No catalog changes to commit."
            exit 0
          fi
          LATEST_VER="$(python3 -c 'import json; print(json.load(open("firmware/factory/versions.json"))["latestVersion"])')"
          git add firmware/
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(firmware): sync official firmware catalog (latest v${LATEST_VER})"
          git pull --rebase origin main
          git push origin HEAD:main
